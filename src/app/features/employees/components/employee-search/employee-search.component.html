<form class="search-form" (ngSubmit)="onSearch()" role="search" aria-label="Search employee by ID">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-field">
    <mat-icon matPrefix class="search-icon">search</mat-icon>
    <mat-label>Search by Employee ID</mat-label>
    <input
      matInput
      type="text"
      placeholder="e.g. 8"
      [formControl]="searchControl"
      (keydown)="onKeyDown($event)"
      aria-label="Enter Employee ID to search"
    />
    <button
      *ngIf="searchControl.value"
      mat-icon-button
      matSuffix
      type="button"
      aria-label="Clear search"
      (click)="onClear()"
    >
      <mat-icon>close</mat-icon>
    </button>
    <mat-error *ngIf="searchControl.hasError('pattern')">
      Please enter a valid numeric ID
    </mat-error>
  </mat-form-field>

  <button
    mat-flat-button
    color="primary"
    type="submit"
    class="search-btn"
    [disabled]="loading || !searchControl.value || searchControl.invalid"
    aria-label="Submit search"
  >
    <mat-progress-spinner
      *ngIf="loading"
      mode="indeterminate"
      diameter="18"
      class="spinner"
    ></mat-progress-spinner>
    <span *ngIf="!loading">Search</span>
  </button>

  <button
    *ngIf="searchControl.value"
    mat-stroked-button
    type="button"
    class="clear-btn"
    [disabled]="loading"
    (click)="onClear()"
    aria-label="Reset search to all employees"
  >
    Clear
  </button>
</form>

<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
  <div *ngFor="let toast of toasts" 
       class="toast show align-items-center text-white border-0 mb-2" 
       [ngClass]="{
         'bg-success': toast.type === 'success',
         'bg-danger': toast.type === 'error',
         'bg-warning text-dark': toast.type === 'warning',
         'bg-info text-dark': toast.type === 'info'
       }"
       role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">
        {{ toast.message }}
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" 
              [class.btn-close-dark]="toast.type === 'warning' || toast.type === 'info'"
              (click)="removeToast(toast.id)" aria-label="Close"></button>
    </div>
  </div>
</div>

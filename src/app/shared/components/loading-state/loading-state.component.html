<div class="loading-container" [attr.aria-busy]="true" role="status" aria-live="polite">
  <div *ngIf="mode === 'spinner'" class="spinner-wrapper">
    <mat-progress-spinner mode="indeterminate" diameter="48" color="primary"></mat-progress-spinner>
    <p class="loading-message">{{ message }}</p>
  </div>

  <div *ngIf="mode === 'table-skeleton'" class="skeleton-table">
    <div class="skeleton-header">
      <div class="skeleton-item" style="width: 8%"></div>
      <div class="skeleton-item" style="width: 20%"></div>
      <div class="skeleton-item" style="width: 22%"></div>
      <div class="skeleton-item" style="width: 15%"></div>
      <div class="skeleton-item" style="width: 15%"></div>
      <div class="skeleton-item" style="width: 10%"></div>
      <div class="skeleton-item" style="width: 10%"></div>
    </div>
    <div *ngFor="let row of skeletonRows" class="skeleton-row">
      <div class="skeleton-item shimmer" style="width: 8%"></div>
      <div class="skeleton-item shimmer" style="width: 20%"></div>
      <div class="skeleton-item shimmer" style="width: 22%"></div>
      <div class="skeleton-item shimmer" style="width: 15%"></div>
      <div class="skeleton-item shimmer" style="width: 15%"></div>
      <div class="skeleton-item shimmer" style="width: 10%"></div>
      <div class="skeleton-item shimmer" style="width: 10%"></div>
    </div>
  </div>
</div>

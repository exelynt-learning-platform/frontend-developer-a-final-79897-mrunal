<div class="empty-state-wrapper" role="status">
  <div class="icon-bubble" aria-hidden="true">
    <mat-icon>{{ icon }}</mat-icon>
  </div>
  <h3 class="empty-title">{{ title }}</h3>
  <p class="empty-message">{{ message }}</p>
  <button
    *ngIf="actionLabel"
    mat-flat-button
    color="primary"
    class="action-btn"
    (click)="onAction()"
  >
    <mat-icon *ngIf="actionIcon">{{ actionIcon }}</mat-icon>
    {{ actionLabel }}
  </button>
</div>

<!-- ═══════════════════════════════════════
     TOP NAVBAR – Fixed, full-width
     ═══════════════════════════════════════ -->
<nav class="ems-navbar" role="navigation" aria-label="Main navigation">

  <!-- LEFT: Hamburger + Brand -->
  <div class="nav-left">
    <!-- Hamburger toggle -->
    <button
      class="nav-toggle"
      (click)="onToggle()"
      aria-label="Toggle sidebar"
      id="sidebar-toggle-btn"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <!-- EMS Portal Logo + Brand Name -->
    <div class="nav-brand">
      <div class="nav-brand-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z" fill="white"/>
          <path d="M12 7a5 5 0 1 1 0 10A5 5 0 0 1 12 7z" fill="#2563eb"/>
        </svg>
      </div>
      <span class="nav-brand-name">EMS Portal</span>
    </div>

  </div>

  <!-- RIGHT: Actions -->
  <div class="nav-right">

    <!-- Notification bell -->
    <button class="nav-icon-btn" aria-label="Notifications" id="notif-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="notif-dot"></span>
    </button>

    <!-- Messages -->
    <button class="nav-icon-btn" aria-label="Messages" id="messages-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </button>

    <!-- Profile -->
    <div class="nav-profile" (click)="toggleDropdown()" (keyup.enter)="toggleDropdown()" tabindex="0">
      <img *ngIf="currentUser.avatar" [src]="currentUser.avatar" class="profile-avatar-img" alt="Avatar">
      <div *ngIf="!currentUser.avatar" class="profile-avatar">{{ currentUser.initials }}</div>
      
      <div class="profile-info d-none d-md-block">
        <span class="profile-name">{{ currentUser.name }}</span>
        <span class="profile-role">{{ currentUser.role }}</span>
      </div>
      <svg class="chevron d-none d-md-block" width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>

      <!-- Dropdown -->
      <div class="profile-dropdown" *ngIf="showUserDropdown" (click)="$event.stopPropagation()">
        <div class="dropdown-header">
          <img *ngIf="currentUser.avatar" [src]="currentUser.avatar" class="dh-avatar-img" alt="Avatar">
          <div *ngIf="!currentUser.avatar" class="dh-avatar">{{ currentUser.initials }}</div>
          
          <div>
            <div class="dh-name">{{ currentUser.name }}</div>
            <div class="dh-role">{{ currentUser.role }}</div>
          </div>
        </div>
        <hr class="dropdown-divider" />
        <a routerLink="/profile" (click)="closeDropdown()" class="dropdown-item-link" id="profile-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          My Profile
        </a>
        <a routerLink="/employee-management/settings" (click)="closeDropdown()" class="dropdown-item-link" id="settings-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
        <hr class="dropdown-divider" />
        <button class="dropdown-item-link text-danger w-100" (click)="logout()" id="logout-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </div>

  </div>
</nav>

<!-- Backdrop to close dropdown -->
<div class="nav-backdrop" *ngIf="showUserDropdown" (click)="closeDropdown()"></div>

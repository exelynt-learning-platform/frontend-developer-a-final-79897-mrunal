<!-- ═══════════════════════════════════════
     SIDEBAR – Fixed left navigation (Premium Theme)
     ═══════════════════════════════════════ -->
<aside class="ems-sidebar" [class.collapsed]="isCollapsed" aria-label="Sidebar navigation">

  <div class="sidebar-section-label" *ngIf="!isCollapsed">MENU</div>

  <nav class="sidebar-nav">
    <ul class="sidebar-menu">

      <!-- Home Link -->
     <!-- Home Dropdown -->
<li class="sidebar-menu-group" [attr.data-tooltip]="isCollapsed ? 'Home' : null">

  <div class="sidebar-group-header"
       [class.active-parent]="router.url.includes('/home')"
       [class.collapsed-view]="isCollapsed"
       (click)="toggleHomeMenu()"
       tabindex="0"
       role="button"
       aria-label="Toggle Home menu">

    <span class="sidebar-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </span>

    <span class="sidebar-label" *ngIf="!isCollapsed">
      Home
    </span>

    <span class="sidebar-chevron"
          *ngIf="!isCollapsed"
          [class.open]="homeExpanded">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </span>

  </div>

  <!-- Home Submenu -->
  <div class="sidebar-submenu-wrapper"
       [class.expanded]="homeExpanded && !isCollapsed">

    <ul class="sidebar-submenu">

      <li class="sidebar-submenu-item">
        <a
          routerLink="/home/dashboard"
          routerLinkActive="active"
          class="sidebar-sublink"
          (click)="onLinkClick()">

          <span class="sidebar-subicon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
            </svg>
          </span>

          <span class="sidebar-sublabel">
            Dashboard
          </span>

        </a>
      </li>

    </ul>

  </div>

</li>

      <!-- Employee Management Dropdown -->
      <li class="sidebar-menu-group" [attr.data-tooltip]="isCollapsed ? 'Employee Management' : null">
        <div class="sidebar-group-header" 
             [class.active-parent]="router.url.includes('/employee-management')"
             [class.collapsed-view]="isCollapsed" 
             (click)="toggleEmployeeMenu()"
             tabindex="0"
             role="button"
             aria-label="Toggle Employee Management menu">
          
          <span class="sidebar-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </span>
          
          <span class="sidebar-label" *ngIf="!isCollapsed">Employee Management</span>
          
          <span class="sidebar-chevron" *ngIf="!isCollapsed" [class.open]="employeeExpanded">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </span>
        </div>

        <!-- Submenu -->
        <div class="sidebar-submenu-wrapper" [class.expanded]="employeeExpanded && !isCollapsed">
          <ul class="sidebar-submenu">
            <!-- Employees -->
            <li class="sidebar-submenu-item">
              <a routerLink="/employee-management/employees" routerLinkActive="active" class="sidebar-sublink" (click)="onLinkClick()">
                <span class="sidebar-subicon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                </span>
                <span class="sidebar-sublabel">Employees</span>
              </a>
            </li>
            <!-- Departments -->
            <li class="sidebar-submenu-item">
              <a routerLink="/employee-management/departments" routerLinkActive="active" class="sidebar-sublink" (click)="onLinkClick()">
                <span class="sidebar-subicon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                </span>
                <span class="sidebar-sublabel">Department</span>
              </a>
            </li>
            <!-- Attendance -->
            <li class="sidebar-submenu-item">
              <a routerLink="/employee-management/attendance" routerLinkActive="active" class="sidebar-sublink" (click)="onLinkClick()">
                <span class="sidebar-subicon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </span>
                <span class="sidebar-sublabel">Attendance</span>
              </a>
            </li>
            <!-- Leave Management -->
            <li class="sidebar-submenu-item">
              <a routerLink="/employee-management/leave" routerLinkActive="active" class="sidebar-sublink" (click)="onLinkClick()">
                <span class="sidebar-subicon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                </span>
                <span class="sidebar-sublabel">Leave</span>
              </a>
            </li>
            <!-- Payroll -->
            <li class="sidebar-submenu-item">
              <a routerLink="/employee-management/payroll" routerLinkActive="active" class="sidebar-sublink" (click)="onLinkClick()">
                <span class="sidebar-subicon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                </span>
                <span class="sidebar-sublabel">Payroll</span>
              </a>
            </li>
            <!-- Reports -->
            <li class="sidebar-submenu-item">
              <a routerLink="/report" routerLinkActive="active" class="sidebar-sublink" (click)="onLinkClick()">
                <span class="sidebar-subicon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6"  y1="20" x2="6"  y2="14"/></svg>
                </span>
                <span class="sidebar-sublabel">Report</span>
              </a>
            </li>
            <!-- Profile
            <li class="sidebar-submenu-item">
              <a routerLink="/profile" routerLinkActive="active" class="sidebar-sublink" (click)="onLinkClick()">
                <span class="sidebar-subicon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                </span>
                <span class="sidebar-sublabel">My Profile</span>
              </a>
            </li> -->
            <!-- Settings -->
            <li class="sidebar-submenu-item">
              <a routerLink="/employee-management/settings" routerLinkActive="active" class="sidebar-sublink" (click)="onLinkClick()">
                <span class="sidebar-subicon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </span>
                <span class="sidebar-sublabel">Settings</span>
              </a>
            </li>
          </ul>
        </div>
      </li>

    </ul>
  </nav>

  <!-- Storage info (bottom)
  <div class="sidebar-footer" *ngIf="!isCollapsed">
    <div class="storage-label">
      <span>Storage</span>
    </div>
    <div class="storage-used">7.4 GB of 10 GB used</div>
    <div class="storage-bar">
      <div class="storage-fill" style="width: 74%"></div>
    </div>
  </div> -->

</aside>
